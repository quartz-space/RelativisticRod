name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ARM64
            rid: win-arm64
          - platform: x64
            rid: win-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build (Release)
        run: dotnet build RelativisticRod.csproj -c Release -p:Platform=${{ matrix.platform }} --nologo

      - name: Publish (unpackaged, self-contained)
        run: dotnet publish RelativisticRod.csproj -c Release -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }} -o publish --nologo

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: RelativisticRod-${{ matrix.rid }}
          path: publish/
          if-no-files-found: error
          retention-days: 14
